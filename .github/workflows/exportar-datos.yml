name: Exportar datos MT5 (CSV para replay)
# Instala MT5 en un runner Windows, se conecta a la cuenta y exporta velas a
# CSV con la API oficial de Python. El artifact ya viene listo para cargarlo
# en replay/replay.html con "Cargar CSV" (admite varios archivos a la vez).
#
# Secrets: MT5_LOGIN, MT5_PASSWORD, MT5_SERVER
#
# Aviso de tamaño: 2 años de M1 son ~1.000.000 de velas (~50 MB) y en el móvil
# tardan en cargar. Lo recomendable es exportar M5..H4 para los 2 años y, si
# quieres M1, hacer otra pasada con "desde" a 3-6 meses.

on:
  workflow_dispatch:
    inputs:
      simbodo:
        description: "Símbolo (tal como aparece en MT5)"
        default: "FX Vol 20"
        required: true
      anios:
        description: "Años hacia atrás (si no pones fechas)"
        default: "2"
        required: true
      desde:
        description: "Desde YYYY.MM.DD (vacío = años atrás)"
        default: ""
        required: false
      hasta:
        description: "Hasta YYYY.MM.DD (vacío = ahora)"
        default: ""
        required: false
      tfs:
        description: "Temporalidades separadas por coma (M1 basta: el replay saca M3..H4 de ahí)"
        default: "M1"
        required: true

permissions:
  contents: read

concurrency:
  group: mt5-exportar-datos
  cancel-in-progress: false

env:
  MT5_DIR: C:\Program Files\MetaTrader 5
  SYM: ${{ github.event.inputs.simbodo }}
  TFS: ${{ github.event.inputs.tfs }}
  YEARS: ${{ github.event.inputs.anios }}
  DESDE: ${{ github.event.inputs.desde }}
  HASTA: ${{ github.event.inputs.hasta }}

jobs:
  exportar:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Comprobar secrets
        shell: pwsh
        env:
          S_LOGIN: ${{ secrets.MT5_LOGIN }}
          S_PASS: ${{ secrets.MT5_PASSWORD }}
          S_SERVER: ${{ secrets.MT5_SERVER }}
        run: |
          $falta = @()
          if (-not $env:S_LOGIN)  { $falta += 'MT5_LOGIN' }
          if (-not $env:S_PASS)   { $falta += 'MT5_PASSWORD' }
          if (-not $env:S_SERVER) { $falta += 'MT5_SERVER' }
          if ($falta.Count -gt 0) {
            Write-Host "Faltan secrets: $($falta -join ', ')"
            exit 1
          }
          Write-Host 'Secrets cargados.'

      - name: Instalar MetaTrader 5
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          Invoke-WebRequest -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' -OutFile $exe -UseBasicParsing
          Start-Process -FilePath $exe -ArgumentList '/auto' -Wait
          for ($i = 0; $i -lt 90; $i++) {
            if (Test-Path "$env:MT5_DIR\terminal64.exe") { break }
            Start-Sleep -Seconds 5
          }
          if (-not (Test-Path "$env:MT5_DIR\terminal64.exe")) { throw 'MT5 no quedó instalado' }
          Write-Host 'MT5 instalado.'

      - name: Subir el tope de barras del terminal
        shell: pwsh
        run: |
          # "Max bars in chart" limita cuánto histórico entrega MT5. El valor
          # de la interfaz "Unlimited" no sirve en el .ini: hay que poner un
          # número grande o el terminal arranca sin datos.
          $dir = Join-Path $env:MT5_DIR 'config'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $ini = Join-Path $dir 'common.ini'
          $txt = if (Test-Path $ini) { Get-Content $ini -Raw } else { '' }
          if ($txt -match '(?m)^\[Charts\]') {
            if ($txt -match '(?m)^MaxBars=') { $txt = $txt -replace '(?m)^MaxBars=.*$', 'MaxBars=100000000' }
            else { $txt = $txt -replace '(?m)^\[Charts\]', "[Charts]`r`nMaxBars=100000000" }
          } else {
            $txt = $txt.TrimEnd() + "`r`n`r`n[Charts]`r`nMaxBars=100000000`r`n"
          }
          Set-Content -Path $ini -Value $txt -Encoding ASCII
          Select-String -Path $ini -Pattern 'MaxBars'

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar cliente de MT5
        shell: pwsh
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet MetaTrader5
          python -c "import MetaTrader5 as m; print('MetaTrader5', m.__version__)"

      - name: Exportar velas a CSV
        shell: pwsh
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
        run: |
          python scripts/exportar_datos.py
          if (-not (Test-Path 'datos_out')) { throw 'no se generó datos_out' }

      - name: Resumen
        if: always()
        shell: pwsh
        run: |
          if (Test-Path 'datos_out\resumen.txt') {
            Get-Content 'datos_out\resumen.txt' | Add-Content -Path $env:GITHUB_STEP_SUMMARY
            Get-Content 'datos_out\resumen.txt'
          } else {
            Write-Warning 'sin resumen'
          }

      - name: Subir CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: datos-mt5-csv
          path: datos_out
          if-no-files-found: warn
          retention-days: 30
