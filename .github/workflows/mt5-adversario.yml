name: MT5 adversario (demo -> Telegram)
# Instala MetaTrader 5 en un runner Windows, entra en la cuenta DEMO, compila y
# arranca el EA adversario. El EA calcula las senales de la escalera y las manda
# por WebRequest; si MT5 bloquea la salida (4014), deja el mensaje en
# MQL5/Files/adv_pendientes.txt y el script de ejecucion lo entrega igual.
#
# Toda la logica vive en mt5-ea/scripts:
#   instalar_mt5.ps1   instala el terminal y compila el EA
#   ejecutar_ea.ps1    configura cuenta/Telegram, arranca y vigila
#
# Secrets (Settings > Secrets and variables > Actions):
#   MT5_LOGIN, MT5_PASSWORD, MT5_SERVER, TELEGRAM_TOKEN, TELEGRAM_CHAT
# Variable opcional: MT5_SYMBOLS
#
# El EA NO opera: solo lee velas del broker real y envia el mensaje.
on:
  workflow_dispatch:
    inputs:
      minutos:
        description: "Minutos que queda abierto el terminal (max 330)"
        default: "240"
        required: true
      servidor:
        description: "Servidor MT5 (vacio = usar el secret MT5_SERVER)"
        default: ""
        required: false

permissions:
  contents: read

env:
  MT5_DIR: C:\Program Files\MetaTrader 5

jobs:
  ea:
    name: ea-${{ matrix.tf }}
    runs-on: windows-latest
    timeout-minutes: 350
    concurrency:
      group: mt5-adversario-${{ matrix.tf }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        tf: [M3, M5, M15]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Comprobar secrets
        shell: pwsh
        env:
          S_LOGIN: ${{ secrets.MT5_LOGIN }}
          S_PASS: ${{ secrets.MT5_PASSWORD }}
          S_SERVER: ${{ secrets.MT5_SERVER }}
          S_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          S_CHAT: ${{ secrets.TELEGRAM_CHAT }}
        run: |
          $falta = @()
          if (-not $env:S_LOGIN)  { $falta += 'MT5_LOGIN' }
          if (-not $env:S_PASS)   { $falta += 'MT5_PASSWORD' }
          if (-not $env:S_SERVER) { $falta += 'MT5_SERVER' }
          if (-not $env:S_TOKEN)  { $falta += 'TELEGRAM_TOKEN' }
          if (-not $env:S_CHAT)   { $falta += 'TELEGRAM_CHAT' }
          if ($falta.Count -gt 0) {
            Write-Host "Faltan secrets: $($falta -join ', ')"
            exit 1
          }
          Write-Host 'Los 5 secrets estan cargados.'

      - name: Instalar MT5 y compilar el EA
        shell: pwsh
        run: ./mt5-ea/scripts/instalar_mt5.ps1 -Fuente 'mt5-ea/EstrategiaAdversaria.mq5'

      - name: Arrancar el EA y vigilar la sesion
        shell: pwsh
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          MT5_SYMBOLS: ${{ vars.MT5_SYMBOLS }}
          S_OVR: ${{ inputs.servidor }}
          MIN: ${{ inputs.minutos }}
          TF_IN: ${{ matrix.tf }}
        run: |
          if ($env:S_OVR) { $env:MT5_SERVER = $env:S_OVR; Write-Host "servidor de prueba: $env:S_OVR" }
          ./mt5-ea/scripts/ejecutar_ea.ps1 -Minutos ([int]$env:MIN) -Tf $env:TF_IN

      - name: Resumen (ultimas senales)
        if: always()
        shell: pwsh
        run: |
          $log = "$env:MT5_DIR\MQL5\Files\adv.log"
          if (Test-Path $log) {
            $sen = Select-String -Path $log -Pattern '\[SENAL\]'
            $out = "Lineas de senal: " + $sen.Count + "`n"
            $out += ($sen | Select-Object -Last 15 | ForEach-Object { $_.Line }) -join "`n"
          } else {
            $out = 'No hay adv.log'
          }
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $out
          if ($out -match 'FALLO http=-1') { Write-Warning 'el EA no pudo salir a Telegram; los mensajes se entregan por el script' }

      - name: Subir logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mt5-adversario-logs-${{ matrix.tf }}
          path: |
            C:\Program Files\MetaTrader 5\MQL5\Files\*.log
            C:\Program Files\MetaTrader 5\MQL5\Files\*.txt
            C:\Program Files\MetaTrader 5\MQL5\Logs\*.log
            C:\Program Files\MetaTrader 5\logs\*.log
          retention-days: 14
          if-no-files-found: warn
