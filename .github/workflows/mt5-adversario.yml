name: MT5 adversario (demo -> Telegram)
# Instala MetaTrader 5 en un runner Windows, entra en la cuenta DEMO, compila y
# arranca el EA adversario. El EA calcula las senales de la escalera y las manda
# por WebRequest; si MT5 bloquea la salida (4014), deja el mensaje en
# MQL5/Files/adv_pendientes.txt y el script de ejecucion lo entrega igual.
#
# Toda la logica vive en mt5-ea/scripts:
#   instalar_mt5.ps1   instala el terminal y compila el EA
#   ejecutar_ea.ps1    configura cuenta/Telegram, arranca y vigila
#
# El EA procesa M3, M5, M15 y M30 en un solo terminal (multi-TF).
# La tendencia mayor se calcula en H1.
#
# Secrets (Settings > Secrets and variables > Actions):
#   MT5_LOGIN, MT5_PASSWORD, MT5_SERVER, TELEGRAM_TOKEN, TELEGRAM_CHAT
# Variable opcional: MT5_SYMBOLS
#
# El EA NO opera: solo lee velas del broker real y envia el mensaje.
on:
  workflow_dispatch:
    inputs:
      minutos:
        description: "Minutos que queda abierto el terminal (max 330)"
        default: "60"
        required: true
      servidor:
        description: "Servidor MT5 (vacio = usar el secret MT5_SERVER)"
        default: ""
        required: false
      panel:
        description: "Publicar el panel web en vivo (si/no)"
        default: "si"
        required: true

permissions:
  contents: write

concurrency:
  group: mt5-adversario
  cancel-in-progress: false

env:
  MT5_DIR: C:\Program Files\MetaTrader 5

jobs:
  ea:
    name: ea
    runs-on: windows-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Comprobar secrets
        shell: pwsh
        env:
          S_LOGIN: ${{ secrets.MT5_LOGIN }}
          S_PASS: ${{ secrets.MT5_PASSWORD }}
          S_SERVER: ${{ secrets.MT5_SERVER }}
          S_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          S_CHAT: ${{ secrets.TELEGRAM_CHAT }}
        run: |
          $falta = @()
          if (-not $env:S_LOGIN)  { $falta += 'MT5_LOGIN' }
          if (-not $env:S_PASS)   { $falta += 'MT5_PASSWORD' }
          if (-not $env:S_SERVER) { $falta += 'MT5_SERVER' }
          if (-not $env:S_TOKEN)  { $falta += 'TELEGRAM_TOKEN' }
          if (-not $env:S_CHAT)   { $falta += 'TELEGRAM_CHAT' }
          if ($falta.Count -gt 0) {
            Write-Host "Faltan secrets: $($falta -join ', ')"
            exit 1
          }
          Write-Host 'Los 5 secrets estan cargados.'

      - name: Instalar MT5 y compilar el EA
        shell: pwsh
        run: ./mt5-ea/scripts/instalar_mt5.ps1 -Fuente 'mt5-ea/EstrategiaAdversaria.mq5'

      - name: Arrancar el EA y vigilar la sesion
        shell: pwsh
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          MT5_SYMBOLS: ${{ vars.MT5_SYMBOLS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          S_OVR: ${{ inputs.servidor }}
          MIN: ${{ inputs.minutos }}
          TF_IN: M5
          PANEL: ${{ inputs.panel }}
        run: |
          if ($env:S_OVR) { $env:MT5_SERVER = $env:S_OVR; Write-Host "servidor de prueba: $env:S_OVR" }
          ./mt5-ea/scripts/ejecutar_ea.ps1 -Minutos ([int]$env:MIN) -Tf $env:TF_IN -Panel $env:PANEL

      - name: Resumen (ultimas senales)
        if: always()
        shell: pwsh
        run: |
          $log = "$env:MT5_DIR\MQL5\Files\adv.log"
          if (Test-Path $log) {
            $sen = Select-String -Path $log -Pattern '\[SENAL\]'
            $out = "Lineas de senal: " + $sen.Count + "`n"
            $out += ($sen | Select-Object -Last 20 | ForEach-Object { $_.Line }) -join "`n"
          } else {
            $out = 'No hay adv.log'
          }
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $out
          if ($out -match 'FALLO http=-1') { Write-Warning 'el EA no pudo salir a Telegram; los mensajes se entregan por el script' }

      # Se copian al workspace antes de subirlos. Antes se subian con globs sobre
      # C:\Program Files y a veces el artifact salia vacio sin avisar; copiando y
      # contando primero, el log del run dice exactamente que se recogio.
      - name: Recoger logs
        if: always()
        shell: pwsh
        run: |
          $dest = 'logs-artifact'
          Remove-Item -Recurse -Force $dest -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $dest | Out-Null

          $map = [ordered]@{
            'MQL5/Files' = "$env:MT5_DIR\MQL5\Files"
            'MQL5/Logs'  = "$env:MT5_DIR\MQL5\Logs"
            'terminal'   = "$env:MT5_DIR\logs"
            'panel'      = "$env:GITHUB_WORKSPACE\panel-out"
          }
          foreach ($k in $map.Keys) {
            $src = $map[$k]
            if (-not (Test-Path $src)) { Write-Host "no existe: $src"; continue }
            $out = Join-Path $dest $k
            New-Item -ItemType Directory -Force -Path $out | Out-Null
            for ($r = 1; $r -le 3; $r++) {
              Get-ChildItem -LiteralPath $src -File -ErrorAction SilentlyContinue |
                Where-Object { $_.Extension -eq '.log' -or $_.Extension -eq '.txt' -or $_.Extension -eq '.json' -or $_.Extension -eq '.png' } |
                ForEach-Object {
                  $f = $_
                  try { Copy-Item -LiteralPath $f.FullName -Destination (Join-Path $out $f.Name) -Force -ErrorAction Stop }
                  catch { Write-Warning "no pude copiar $($f.Name): $($_.Exception.Message)" }
                }
              $n = @(Get-ChildItem -LiteralPath $out -File -ErrorAction SilentlyContinue).Count
              if ($n -gt 0) { break }
              Start-Sleep -Seconds 5
            }
            Write-Host "$k -> $(@(Get-ChildItem -LiteralPath $out -File -ErrorAction SilentlyContinue).Count) archivo(s)"
          }

          # Solo las lineas de WebRequest: common.ini lleva login y contrasena y el
          # repo es publico, asi que el archivo no se sube, solo se informa.
          $cp = Join-Path $env:MT5_DIR 'config\common.ini'
          if (Test-Path $cp) {
            $wr = @(Get-Content -LiteralPath $cp -Encoding Unicode | Select-String 'WebRequest')
            if ($wr.Count -gt 0) { $wr | ForEach-Object { Write-Host "common.ini: $_" } }
            else { Write-Warning 'common.ini sin lineas WebRequest (por eso da 4014)' }
          } else { Write-Warning 'no existe config\common.ini' }

          $rec = @(Get-ChildItem -Path $dest -Recurse -File)
          Write-Host "total recogido: $($rec.Count) archivo(s)"
          $rec | Sort-Object FullName | ForEach-Object { Write-Host ('  {0}  {1} B' -f $_.FullName, $_.Length) }
          if ($rec.Count -eq 0) { Write-Warning 'no se recogio ningun log' }

      - name: Subir logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mt5-adversario-logs
          path: logs-artifact
          retention-days: 14
          if-no-files-found: warn
