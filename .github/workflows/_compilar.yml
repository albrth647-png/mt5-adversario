name: _compilar (temporal)
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  MT5_DIR: C:\Program Files\MetaTrader 5
jobs:
  c:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Instalar MT5
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          Invoke-WebRequest -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' -OutFile $exe -UseBasicParsing
          Start-Process -FilePath $exe -ArgumentList '/auto' -Wait
          for ($i=0; $i -lt 90; $i++) { if (Test-Path "$env:MT5_DIR\metaeditor64.exe") { break }; Start-Sleep 5 }
          if (-not (Test-Path "$env:MT5_DIR\metaeditor64.exe")) { throw 'MT5 no instalo' }
          Write-Host "MetaEditor presente"
      - name: Compilar
        shell: pwsh
        run: |
          $dst = "$env:MT5_DIR\MQL5\Experts"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item 'mt5-ea\EstrategiaAdversaria.mq5' $dst -Force
          & "$env:MT5_DIR\metaeditor64.exe" "/compile:$dst\EstrategiaAdversaria.mq5" "/log:$env:RUNNER_TEMP\c"
          Start-Sleep 2
          if (Test-Path "$env:RUNNER_TEMP\c.log") {
            Write-Host '--- log del compilador ---'
            Get-Content "$env:RUNNER_TEMP\c.log" -Encoding Unicode
          }
          if (Test-Path "$dst\EstrategiaAdversaria.ex5") {
            Write-Host "EX5 OK: $((Get-Item "$dst\EstrategiaAdversaria.ex5").Length) bytes"
          } else {
            throw 'SIN EX5'
          }
