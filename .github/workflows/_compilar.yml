name: _compilar (temporal)
# Verifica que el EA compila con el MetaEditor real, sin credenciales.
# Receta tomada de un workflow que compila MQL5 en Actions:
#   - el instalador corre asincrono: /auto sin -Wait y luego sondear rutas
#   - el compilador necesita /portable para resolver el arbol MQL5 del install
#   - el codigo de salida de MetaEditor no es fiable: manda el log
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Descargar instalador
        shell: pwsh
        run: |
          $url = 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe'
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\mt5setup.exe"
          Write-Host "instalador: $((Get-Item "$env:RUNNER_TEMP\mt5setup.exe").Length) bytes"

      - name: Instalar MT5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $mt5 = 'C:\Program Files\MetaTrader 5'
          $me  = "$mt5\MetaEditor64.exe"
          $inc = "$mt5\MQL5\Include\Trade\Trade.mqh"

          function Wait-ForPath($p, $minutes) {
            $deadline = (Get-Date).AddMinutes($minutes)
            while (-not (Test-Path -LiteralPath $p) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 5 }
            return (Test-Path -LiteralPath $p)
          }

          Start-Process -FilePath "$env:RUNNER_TEMP\mt5setup.exe" -ArgumentList '/auto' | Out-Null

          if (-not (Wait-ForPath $me 8))  { throw 'MetaEditor no aparecio: la instalacion no termino' }
          Write-Host "MetaEditor: $me ($((Get-Item $me).Length) bytes)"

          if (-not (Wait-ForPath $inc 4)) {
            $term = "$mt5\terminal64.exe"
            if (Wait-ForPath $term 4) {
              Write-Host 'Falta la biblioteca estandar: abro el terminal para que la despliegue'
              $p = Start-Process -FilePath $term -ArgumentList '/portable' -WorkingDirectory $mt5 -PassThru
              Wait-ForPath $inc 3 | Out-Null
              try { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue } catch {}
            }
          }
          if (-not (Test-Path -LiteralPath $inc)) { throw "biblioteca estandar ausente: $inc" }
          Write-Host "biblioteca lista: $inc"

          Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Compilar
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $mt5     = 'C:\Program Files\MetaTrader 5'
          $experts = "$mt5\MQL5\Experts"
          $src     = "$experts\EstrategiaAdversaria.mq5"
          $ex5     = "$experts\EstrategiaAdversaria.ex5"
          $log     = "$env:RUNNER_TEMP\compile.log"

          New-Item -ItemType Directory -Force -Path $experts | Out-Null
          Copy-Item 'mt5-ea\EstrategiaAdversaria.mq5' $src -Force
          Write-Host "fuente: $((Get-Item $src).Length) bytes"
          if (Test-Path $ex5) { Remove-Item $ex5 -Force }

          Start-Process -FilePath "$mt5\MetaEditor64.exe" `
            -ArgumentList '/portable', "/compile:`"$src`"", "/log:`"$log`"" -Wait

          if (-not (Test-Path $log)) { throw 'MetaEditor no dejo log' }
          $text = Get-Content -Path $log -Encoding Unicode -Raw
          Write-Host '----------------- log de MetaEditor -----------------'
          Write-Host $text
          Write-Host '-----------------------------------------------------'

          $m = [regex]::Match($text, 'Result:\s*(\d+)\s*error')
          $errors = if ($m.Success) { [int]$m.Groups[1].Value } else { 1 }
          if (-not (Test-Path $ex5)) { throw "SIN EX5 ($errors errores)" }
          if ($errors -gt 0) { throw "COMPILACION CON $errors ERROR(ES)" }
          Write-Host "OK: ex5 = $((Get-Item $ex5).Length) bytes"
